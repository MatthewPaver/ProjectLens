name: Verify and deploy ProjectLens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projectlens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Benches + unit/RAG tests gate the public fixture. Browser journeys live in
  # a sibling job so an apt DNS flake cannot block Pages after the floors pass.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-rag.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Run the real-case benchmark floors
        # Fails if any set drops below floors.json (set 5 is 29/40 today).
        run: npm run bench
      - name: Install test and RAG dependencies
        run: make install-rag
      - name: Run deterministic and RAG tests
        run: .venv/bin/python -m pytest Processing/tests -q
      - name: Rebuild the public fixture
        run: .venv/bin/python Processing/gmpp_pipeline.py
      - name: Assemble the Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -R docs/. _site/
      - name: Upload the verified Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-rag.txt
      - name: Install test and RAG dependencies
        run: make install-rag
      - name: Install Chromium
        # Retry: runner apt mirrors sometimes fail DNS mid-install.
        run: |
          for attempt in 1 2 3; do
            if .venv/bin/python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Chromium install attempt ${attempt} failed; waiting before retry"
            sleep 20
          done
          exit 1
      - name: Run browser journeys
        run: .venv/bin/python scripts/run_browser_tests.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
